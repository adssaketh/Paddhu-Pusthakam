name: Regenerate drift files

# One-off helper for the household-login work: after tables.dart changes, this
# regenerates tables.g.dart, drift_schemas/ and schema_versions.dart with the
# pinned Flutter version and commits them back to the same branch.
# Remove this file once the household branch is merged.

on:
  workflow_dispatch:
  push:
    branches: [household-step1-data-model]
    paths:
      - "budget/lib/database/tables.dart"
      - ".github/workflows/regen-drift.yml"

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Dump schema and generate migration steps
        run: |
          dart run drift_dev schema dump lib/database/tables.dart drift_schemas/drift_schema_v48.json
          dart run drift_dev schema steps drift_schemas/ lib/database/schema_versions.dart

      - name: Analyze
        run: flutter analyze lib/database --no-fatal-infos --no-fatal-warnings

      - name: Commit generated files
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add budget/lib/database/tables.g.dart budget/lib/database/schema_versions.dart budget/drift_schemas
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate drift files for schema 48"
            git push
          fi

      # The push above does not start other workflows, so the analyzer report for the
      # final state is made here and published to the ci-report branch.
      - name: Analyze final state
        run: |
          flutter analyze > ../analyze_full.txt 2>&1 || true
          grep -E " error • " ../analyze_full.txt > ../report_errors.txt || true
          grep -iE "household|accountsPage|defaultPreferences|settingsMerge" ../analyze_full.txt > ../report_touched.txt || true
          tail -3 ../analyze_full.txt > ../report_summary.txt || true

      - name: Publish report
        if: always()
        working-directory: .
        run: |
          mkdir /tmp/report
          cp report_errors.txt report_touched.txt report_summary.txt /tmp/report/ || true
          git rev-parse HEAD > /tmp/report/commit.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Analyzer report after regeneration"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-report
