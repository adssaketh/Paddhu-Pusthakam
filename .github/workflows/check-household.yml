name: Check household branch

# Temporary helper for the household-login work. It cannot be run locally, so this
# runs the analyzer and pushes a short report to the "ci-report" branch.
# Remove this file once the household branch is merged.

on:
  workflow_dispatch:
  push:
    branches: [household-step1-data-model]
    paths:
      - "budget/lib/**"
      - "budget/test/**"
      - ".github/workflows/check-household.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - run: flutter pub get

      # When tables.dart changed, the regeneration workflow makes the report instead.
      - name: Is the generated code out of date?
        id: gen
        run: |
          if grep -q "householdSyncedAt" lib/database/tables.dart && ! grep -q "householdSyncedAt" lib/database/tables.g.dart; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze
        if: steps.gen.outputs.stale != 'true'
        run: |
          flutter analyze > ../analyze_full.txt 2>&1 || true
          grep -E " error • " ../analyze_full.txt > ../report_errors.txt || true
          grep -iE "household|accountsPage|defaultPreferences|settingsMerge" ../analyze_full.txt > ../report_touched.txt || true
          tail -3 ../analyze_full.txt > ../report_summary.txt || true

      - name: Publish report
        if: always() && steps.gen.outputs.stale != 'true'
        working-directory: .
        run: |
          mkdir /tmp/report
          cp report_errors.txt report_touched.txt report_summary.txt /tmp/report/ || true
          echo "$GITHUB_SHA" > /tmp/report/commit.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Analyzer report for $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-report
