name: Check household branch

# Temporary helper for the loans / fixed deposits sharing work. It cannot be run locally, so this
# runs the analyzer and the tests, and pushes a short report to the "ci-report" branch.
# Remove this file once the household-loans-fds branch is merged.

on:
  workflow_dispatch:
  push:
    branches: [sync-rewrite]
    paths:
      - "budget/lib/**"
      - "budget/test/**"
      - ".github/workflows/check-household.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze > ../analyze_full.txt 2>&1 || true
          grep -E " error • " ../analyze_full.txt > ../report_errors.txt || true
          grep -iE "household|sharing|sharedItem|fixedDeposit|loanTerms|settingsMerge" ../analyze_full.txt > ../report_touched.txt || true
          tail -3 ../analyze_full.txt > ../report_summary.txt || true

      - name: Tests
        run: |
          : > ../report_tests.txt
          for t in test/household_*_test.dart test/settings_merge_test.dart test/fixed_deposit_test.dart test/loan_schedule_test.dart test/phonepe_other_apps_test.dart test/household_reconcile_test.dart; do
            echo "== $t" >> ../report_tests.txt
            if dart run "$t" >> ../report_tests.txt 2>&1; then
              echo "PASS $t" >> ../report_tests.txt
            else
              echo "FAIL $t" >> ../report_tests.txt
            fi
          done
          grep -E "^(PASS|FAIL) " ../report_tests.txt > ../report_tests_summary.txt || true

      - name: Publish report
        if: always()
        working-directory: .
        run: |
          mkdir /tmp/report
          cp report_errors.txt report_touched.txt report_summary.txt report_tests.txt report_tests_summary.txt /tmp/report/ || true
          echo "$GITHUB_SHA" > /tmp/report/commit.txt
          cd /tmp/report
          git init -q
          git checkout -q -b ci-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Analyzer report for $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin ci-report
